[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkdn-connect"
version = "0.1.0"
description = "Clicks Connect buttons on a LinkedIn page by looking at the screen"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "mss>=10.2",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pynput>=1.7",
  "evdev>=1.6; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
linkdn-connect = "linkdn_connect.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linkdn_connect = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
