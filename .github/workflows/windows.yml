name: windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install . pyinstaller pytest

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/auto-linkdn-connect.spec

      - name: Launch the exe and run its self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\auto-linkdn-connect.exe -ArgumentList "--self-test", "selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: auto-linkdn-connect-windows
          path: dist/auto-linkdn-connect.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/auto-linkdn-connect.exe --title "${{ github.ref_name }}" --generate-notes
